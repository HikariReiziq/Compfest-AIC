<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GLB Preview Renderer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f0f0f0; font-family: system-ui; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    #status { margin: 10px 0; font-size: 14px; color: #333; }
    #canvas-container { width: 512px; height: 512px; background: transparent; }
    canvas { width: 100%; height: 100%; }
    #preview-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; max-width: 1200px; }
    .preview-card { border: 1px solid #ddd; border-radius: 8px; overflow: hidden; width: 180px; background: #fff; }
    .preview-card img { width: 180px; height: 180px; object-fit: contain; background: linear-gradient(135deg, #f8f9fa, #e9ecef); }
    .preview-card .label { padding: 4px 8px; font-size: 10px; color: #555; text-align: center; word-break: break-all; }
  </style>
</head>
<body>
  <h2>🔧 GLB → PNG Preview Renderer</h2>
  <div id="status">Initializing Three.js...</div>
  <div id="canvas-container"></div>
  <div id="preview-grid"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
      "three/examples/jsm/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/loaders/GLTFLoader.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

    const SIZE = 512;
    const container = document.getElementById('canvas-container');
    const statusEl = document.getElementById('status');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setSize(SIZE, SIZE);
    renderer.setPixelRatio(1);
    renderer.setClearColor(0x000000, 0);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    // Premium product photography lighting
    scene.add(new THREE.AmbientLight(0xffffff, 1.8));
    const keyLight = new THREE.DirectionalLight(0xffffff, 3.0);
    keyLight.position.set(3, 5, 4);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xe8e0f0, 1.5);
    fillLight.position.set(-3, 2, 3);
    scene.add(fillLight);
    const rimLight = new THREE.DirectionalLight(0x90b0ff, 1.2);
    rimLight.position.set(0, -2, -3);
    scene.add(rimLight);

    const loader = new GLTFLoader();

    // Expose renderGLB as a global function for Puppeteer
    window.renderGLB = function(url, cat) {
      return new Promise((resolve, reject) => {
        // Clear previous model groups
        for (let i = scene.children.length - 1; i >= 0; i--) {
          const child = scene.children[i];
          if (child instanceof THREE.Group) {
            scene.remove(child);
            child.traverse(c => { if (c.isMesh) { c.geometry?.dispose(); } });
          }
        }

        loader.load(url, (gltf) => {
          const model = gltf.scene;
          const wrapper = new THREE.Group();
          wrapper.add(model);
          scene.add(wrapper);

          // Auto-center and normalize
          const box = new THREE.Box3().setFromObject(model);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          model.position.sub(center);

          const maxDim = Math.max(size.x, size.y, size.z) || 1;
          model.scale.multiplyScalar(1.5 / maxDim);

          // Category-specific camera angles for best product shot
          const isG = cat === 'glasses';
          const isH = cat === 'hats';

          if (isG) {
            camera.position.set(0, 0.1, 2.8);
            wrapper.rotation.set(0.05, -0.3, 0);
          } else if (isH) {
            camera.position.set(0, 0.5, 2.8);
            wrapper.rotation.set(-0.15, -0.4, 0);
          } else {
            camera.position.set(0, 0.2, 3.0);
            wrapper.rotation.set(0, -0.25, 0);
          }

          camera.lookAt(0, 0, 0);
          camera.updateProjectionMatrix();
          renderer.render(scene, camera);

          resolve(renderer.domElement.toDataURL('image/png'));
        }, undefined, (err) => {
          reject(new Error(err?.message || 'GLB load failed'));
        });
      });
    };

    statusEl.textContent = 'Ready! renderGLB() available.';
    console.log('Three.js renderer initialized.');
  </script>
</body>
</html>
