[project]
name = "coba-backend"
version = "0.1.0"
description = "COBA - Cocokkan Outfit Sesuai Badan Anda. Backend API."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions", ".compfest"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "ASYNC",     # async pitfalls
    "S",         # bandit (security)
    "T20",       # no print()
    "SIM",       # simplify
    "RUF",
]
ignore = [
    "B008",  # Depends() di default argument adalah idiom FastAPI
    "S101",  # assert dipakai di test
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"alembic/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "integration: butuh Postgres dan Redis hidup",
]
