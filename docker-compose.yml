services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: coba-backend-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - MOCK_MODE=false
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
    volumes:
      - ./ai_engine/models/weights:/app/ai_engine/models/weights:ro
      - ./ai_engine/data:/app/ai_engine/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: coba-frontend-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      server:
        condition: service_healthy
